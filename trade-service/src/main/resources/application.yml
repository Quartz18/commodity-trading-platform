spring:
  application:
    name: trade-service
  datasource:
    url: jdbc:postgresql://localhost:5432/trading_db
    username: juser
    password: jpassword
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format-sql: true
  sql:
    init:
      mode: always
logging:
  level:
    root: INFO
    '[com.company.trade]': DEBUG
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics